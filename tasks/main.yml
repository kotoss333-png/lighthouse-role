---
- name: Install epel-release
  become: true
  ansible.builtin.yum:
    name: epel-release
    state: present

- name: Install nginx
  become: true
  ansible.builtin.yum:
    name: nginx
    state: present
  notify: Reload nginx

- name: Ensure lighthouse directory exists
  become: true
  ansible.builtin.file:
    path: "{{ lighthouse_location_dir }}"
    state: directory
    mode: "0755"

- name: Clone lighthouse repository
  become: true
  ansible.builtin.git:
    repo: "{{ lighthouse_vcs }}"
    version: master
    dest: "{{ lighthouse_location_dir }}"

- name: Deploy lighthouse nginx config
  become: true
  ansible.builtin.template:
    src: lighthouse.conf.j2
    dest: /etc/nginx/conf.d/lighthouse.conf
    mode: "0644"
  notify: Reload nginx

- name: Ensure nginx service is started and enabled
  become: true
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
